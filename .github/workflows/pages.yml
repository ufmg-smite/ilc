name: Deploy course sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Each semester directory is a self-contained Jekyll site, built under
      # its own baseurl. Add a build line here when creating a new semester.
      - name: Build 2026.1
        run: bundle exec jekyll build -s 2026.1 -d _site/2026.1 -b /ilc/2026.1
      - name: Build 2026.2
        run: bundle exec jekyll build -s 2026.2 -d _site/2026.2 -b /ilc/2026.2
      - name: Add landing page
        run: cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
